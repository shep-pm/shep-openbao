[package]
name = "shep-openbao"
version = "0.1.0"
edition = "2024"
# shep's MSRV. A dog or client that needs a newer compiler than the shepherd
# it works with is a bad example.
rust-version = "1.88"
description = "A provider dog for shep: mirrors secrets from OpenBao into shep's secrets store"
repository = "https://github.com/shep-pm/shep-openbao"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[features]
# The tier that drives a real shepherd and a real OpenBao. Off by default
# because a fresh clone has neither.
integration = []

[dependencies]
# The only path to shep-core: `shep_client::shep_core`, never a second direct
# dependency. 0.11.0 is the floor because it is the release carrying the
# shared dog infrastructure (Stop, DogRuntime, the startup prelude and the
# exit codes); `PutSecrets` itself has been there since 0.6.2.
shep-client = "0.11.0"
# `#[derive(JsonSchema)]` expands to absolute `schemars::` paths, so the crate
# has to be nameable here even though shep-client carries it.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "signal", "sync"] }
# rustls with ring rather than reqwest's default aws-lc-rs: the smaller C
# build, and the provider shep's own workspace already uses through
# tokio-rustls. `rustls-no-provider` keeps aws-lc-rs out of the tree, which
# is why `rustls` is named here at all: something has to supply the provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
shep-client = { version = "0.11.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net", "io-util", "sync"] }

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "integration"
required-features = ["integration"]

# Debug info dominates a debug build, and a dependency's is never what is
# being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed: shep measured thin LTO with one codegen unit at a quarter
# off its binary and nothing off its runtime. Not `strip` (a profiler names
# frames by symbol) and not `panic = "abort"` (shep-client re-raises a
# panicked task with `resume_unwind`).
[profile.release]
lto = "thin"
codegen-units = 1
